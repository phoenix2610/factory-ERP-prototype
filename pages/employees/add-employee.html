<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Employee — Factory ERP</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media(max-width:700px){ .form-grid { grid-template-columns:1fr; } }
    .section-title {
      font-size:0.75rem; text-transform:uppercase; letter-spacing:.08em;
      color:#888; font-weight:600; margin:1.5rem 0 1rem;
      padding-bottom:0.5rem; border-bottom:1px solid var(--border);
    }
    .emp-preview {
      display:flex; align-items:center; gap:1rem;
      padding:1rem; background:var(--bg); border-radius:10px; margin-bottom:1.5rem;
    }
    .emp-avatar-lg {
      width:60px; height:60px; border-radius:50%;
      background:var(--primary); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; font-weight:700;
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="topbar-container"></div>
    <main class="page-content">

      <!-- Header -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <div>
          <h1 style="font-size:1.5rem; font-weight:700; margin:0;" id="page-title">Add Employee</h1>
          <p style="color:#888; font-size:0.875rem; margin:4px 0 0;">Fill in the employee details below</p>
        </div>
        <a href="/pages/employees/index.html" class="btn btn-ghost">← Back to Employees</a>
      </div>

      <!-- Preview Card -->
      <div class="emp-preview" id="emp-preview" style="display:none;">
        <div class="emp-avatar-lg" id="preview-avatar">?</div>
        <div>
          <div style="font-weight:700; font-size:1.1rem;" id="preview-name">—</div>
          <div style="color:#888; font-size:0.875rem;" id="preview-role">—</div>
          <div style="margin-top:4px;"><span class="badge badge-success" id="preview-empid">—</span></div>
        </div>
      </div>

      <!-- Form Card -->
      <div class="card">
        <div class="card-header">
          <span>Employee Information</span>
        </div>
        <div class="card-body">

          <p class="section-title">Personal Details</p>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-input" id="emp-name" placeholder="e.g. Ravi Kumar"
                oninput="updatePreview()">
              <span class="form-error" id="name-error" style="display:none;">Name is required</span>
            </div>
            <div class="form-group">
              <label class="form-label">Employee ID</label>
              <input type="text" class="form-input" id="emp-id" placeholder="Auto-generated" readonly
                style="background:var(--bg); cursor:not-allowed;">
            </div>
            <div class="form-group">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-input" id="emp-phone" placeholder="e.g. 9876543210">
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="emp-email" placeholder="e.g. ravi@factory.com">
            </div>
          </div>

          <p class="section-title">Work Details</p>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Role *</label>
              <select class="form-select" id="emp-role" onchange="updatePreview()">
                <option value="">— Select Role —</option>
                <option>Floor Worker</option>
                <option>Supervisor</option>
                <option>Manager</option>
                <option>Driver</option>
                <option>Admin</option>
                <option>Quality Inspector</option>
                <option>Packer</option>
              </select>
              <span class="form-error" id="role-error" style="display:none;">Role is required</span>
            </div>
            <div class="form-group">
              <label class="form-label">Department *</label>
              <select class="form-select" id="emp-dept">
                <option value="">— Select Department —</option>
                <option>Production</option>
                <option>QC</option>
                <option>Dispatch</option>
                <option>Inventory</option>
                <option>HR</option>
                <option>Sales</option>
              </select>
              <span class="form-error" id="dept-error" style="display:none;">Department is required</span>
            </div>
            <div class="form-group">
              <label class="form-label">Shift</label>
              <select class="form-select" id="emp-shift">
                <option value="Morning">🌅 Morning (6am–2pm)</option>
                <option value="Evening">🌇 Evening (2pm–10pm)</option>
                <option value="Night">🌙 Night (10pm–6am)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Join Date</label>
              <input type="date" class="form-input" id="emp-joindate">
            </div>
          </div>

          <p class="section-title">Compensation</p>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Basic Salary (₹/month) *</label>
              <input type="number" class="form-input" id="emp-salary" placeholder="e.g. 18000" min="0">
              <span class="form-error" id="salary-error" style="display:none;">Salary is required</span>
            </div>
            <div class="form-group">
              <label class="form-label">Employment Status</label>
              <select class="form-select" id="emp-status">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
          </div>

          <p class="section-title">Additional Info</p>
          <div class="form-group">
            <label class="form-label">Notes / Remarks</label>
            <textarea class="form-textarea" id="emp-notes" rows="3"
              placeholder="Any additional information about this employee..."></textarea>
          </div>

          <!-- Actions -->
          <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border);">
            <a href="/pages/employees/index.html" class="btn btn-ghost">Cancel</a>
            <button class="btn btn-primary" onclick="saveEmployee()">
              <span id="save-btn-text">Save Employee</span>
            </button>
          </div>

        </div>
      </div>

    </main>
  </div>
  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script src="/assets/js/mockdata.js"></script>
  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/router.js"></script>
  <script>
    checkAuth();

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id') ? parseInt(urlParams.get('id')) : null;
    let isEditMode = false;

    function generateEmpId() {
      const count = MockData.employees.length + 1;
      return 'EMP-' + String(count).padStart(4, '0');
    }

    function getInitials(name) {
      return (name || '?').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
    }

    function updatePreview() {
      const name = document.getElementById('emp-name').value.trim();
      const role = document.getElementById('emp-role').value;
      const empId = document.getElementById('emp-id').value;

      const preview = document.getElementById('emp-preview');
      if (name) {
        preview.style.display = 'flex';
        document.getElementById('preview-avatar').textContent = getInitials(name);
        document.getElementById('preview-name').textContent = name;
        document.getElementById('preview-role').textContent = role || 'Role not set';
        document.getElementById('preview-empid').textContent = empId;
      } else {
        preview.style.display = 'none';
      }
    }

    function validateForm() {
      let valid = true;
      const name = document.getElementById('emp-name').value.trim();
      const role = document.getElementById('emp-role').value;
      const dept = document.getElementById('emp-dept').value;
      const salary = document.getElementById('emp-salary').value;

      document.getElementById('name-error').style.display = !name ? 'block' : 'none';
      document.getElementById('role-error').style.display = !role ? 'block' : 'none';
      document.getElementById('dept-error').style.display = !dept ? 'block' : 'none';
      document.getElementById('salary-error').style.display = !salary ? 'block' : 'none';

      if (!name || !role || !dept || !salary) valid = false;
      return valid;
    }

    function saveEmployee() {
      if (!validateForm()) {
        showToast('Please fill in all required fields', 'warning');
        return;
      }

      const empData = {
        name: document.getElementById('emp-name').value.trim(),
        empId: document.getElementById('emp-id').value,
        phone: document.getElementById('emp-phone').value.trim(),
        email: document.getElementById('emp-email').value.trim(),
        role: document.getElementById('emp-role').value,
        department: document.getElementById('emp-dept').value,
        shift: document.getElementById('emp-shift').value,
        joinDate: document.getElementById('emp-joindate').value,
        salary: parseFloat(document.getElementById('emp-salary').value),
        status: document.getElementById('emp-status').value,
        notes: document.getElementById('emp-notes').value.trim()
      };

      if (isEditMode) {
        const existing = MockData.employees.find(e => e.id === editId);
        if (existing) {
          Object.assign(existing, empData);
          showToast(\`\${empData.name}'s profile updated!\`, 'success');
        }
      } else {
        empData.id = MockData.employees.length + 1;
        MockData.employees.push(empData);
        showToast(\`\${empData.name} added successfully!\`, 'success');
      }

      setTimeout(() => { window.location.href = '/pages/employees/index.html'; }, 800);
    }

    // Init: set default join date to today
    document.getElementById('emp-joindate').value = new Date().toISOString().split('T')[0];

    // Edit mode: pre-fill form
    if (editId) {
      const emp = MockData.employees.find(e => e.id === editId);
      if (emp) {
        isEditMode = true;
        document.getElementById('page-title').textContent = 'Edit Employee';
        document.getElementById('save-btn-text').textContent = 'Update Employee';

        document.getElementById('emp-name').value = emp.name || '';
        document.getElementById('emp-id').value = emp.empId || '';
        document.getElementById('emp-phone').value = emp.phone || '';
        document.getElementById('emp-email').value = emp.email || '';
        document.getElementById('emp-role').value = emp.role || '';
        document.getElementById('emp-dept').value = emp.department || '';
        document.getElementById('emp-shift').value = emp.shift || 'Morning';
        document.getElementById('emp-joindate').value = emp.joinDate || '';
        document.getElementById('emp-salary').value = emp.salary || '';
        document.getElementById('emp-status').value = emp.status || 'Active';
        document.getElementById('emp-notes').value = emp.notes || '';

        updatePreview();
      } else {
        showToast('Employee not found', 'error');
      }
    } else {
      // New employee: auto-generate ID
      document.getElementById('emp-id').value = generateEmpId();
    }
  </script>
</body>
</html>
