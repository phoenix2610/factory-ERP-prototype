<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Factory ERP</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="topbar-container"></div>
    <main class="page-content">

      <!-- Page Header -->
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <div>
          <h1 class="page-title">📦 Inventory</h1>
          <p class="page-subtitle" style="color:var(--text-muted);margin-top:0.25rem;">Manage products, stock levels, and SKUs</p>
        </div>
        <div id="add-btn-wrapper">
          <a href="/pages/inventory/add-product.html" class="btn btn-primary">+ Add Product</a>
        </div>
      </div>

      <!-- Filters Row -->
      <div class="card" style="margin-bottom:1.25rem;">
        <div class="card-body" style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center;">
          <input type="text" class="form-input" id="search-input" placeholder="🔍 Search by name or SKU..." style="flex:1;min-width:220px;">
          <select class="form-select" id="filter-category" style="min-width:160px;">
            <option value="">All Categories</option>
          </select>
          <select class="form-select" id="filter-status" style="min-width:160px;">
            <option value="">All Stock Status</option>
            <option value="in">In Stock</option>
            <option value="low">Low Stock</option>
            <option value="out">Out of Stock</option>
          </select>
          <button class="btn btn-ghost" id="clear-filters-btn">Clear</button>
        </div>
      </div>

      <!-- Summary KPIs -->
      <div class="grid-4" style="margin-bottom:1.25rem;" id="kpi-row">
        <div class="card">
          <div class="card-body" style="text-align:center;">
            <div style="font-size:1.75rem;font-weight:700;color:var(--primary);" id="kpi-total">0</div>
            <div style="color:var(--text-muted);font-size:0.85rem;">Total SKUs</div>
          </div>
        </div>
        <div class="card">
          <div class="card-body" style="text-align:center;">
            <div style="font-size:1.75rem;font-weight:700;color:var(--success);" id="kpi-instock">0</div>
            <div style="color:var(--text-muted);font-size:0.85rem;">In Stock</div>
          </div>
        </div>
        <div class="card">
          <div class="card-body" style="text-align:center;">
            <div style="font-size:1.75rem;font-weight:700;color:var(--warning);" id="kpi-low">0</div>
            <div style="color:var(--text-muted);font-size:0.85rem;">Low Stock</div>
          </div>
        </div>
        <div class="card">
          <div class="card-body" style="text-align:center;">
            <div style="font-size:1.75rem;font-weight:700;color:var(--danger);" id="kpi-out">0</div>
            <div style="color:var(--text-muted);font-size:0.85rem;">Out of Stock</div>
          </div>
        </div>
      </div>

      <!-- Product Table -->
      <div class="card">
        <div class="card-body" style="padding:0;">
          <table class="table-base" style="width:100%;">
            <thead>
              <tr>
                <th>SKU</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Unit</th>
                <th>Stock</th>
                <th>Reorder Level</th>
                <th>Price</th>
                <th>Status</th>
                <th id="actions-header">Actions</th>
              </tr>
            </thead>
            <tbody id="product-tbody">
              <tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--text-muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div style="display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-top:1px solid var(--border);">
          <span id="pagination-info" style="color:var(--text-muted);font-size:0.875rem;"></span>
          <div style="display:flex;gap:0.5rem;">
            <button class="btn btn-ghost btn-sm" id="prev-btn" onclick="changePage(-1)">← Prev</button>
            <span id="page-indicator" style="padding:0.375rem 0.75rem;font-size:0.875rem;color:var(--text-muted);"></span>
            <button class="btn btn-ghost btn-sm" id="next-btn" onclick="changePage(1)">Next →</button>
          </div>
        </div>
      </div>

    </main>
  </div>
  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script src="/assets/js/mockdata.js"></script>
  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/router.js"></script>
  <script>
    checkAuth();

    const ROWS_PER_PAGE = 10;
    let currentPage = 1;
    let filteredProducts = [];
    const user = getCurrentUser();

    // Hide add button and actions col for staff
    if (user.role === 'staff') {
      document.getElementById('add-btn-wrapper').style.display = 'none';
      document.getElementById('actions-header').style.display = 'none';
    }

    // Populate category filter
    function populateCategoryFilter() {
      const sel = document.getElementById('filter-category');
      MockData.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.name;
        opt.textContent = cat.name;
        sel.appendChild(opt);
      });
    }

    // Compute KPIs
    function renderKPIs(products) {
      document.getElementById('kpi-total').textContent = products.length;
      document.getElementById('kpi-instock').textContent = products.filter(p => p.stock > p.reorderLevel).length;
      document.getElementById('kpi-low').textContent = products.filter(p => p.stock > 0 && p.stock <= p.reorderLevel).length;
      document.getElementById('kpi-out').textContent = products.filter(p => p.stock === 0).length;
    }

    // Get stock status
    function getStockBadge(product) {
      if (product.stock === 0) return '<span class="badge badge-danger">Out of Stock</span>';
      if (product.stock <= product.reorderLevel) return '<span class="badge badge-warning">Low Stock</span>';
      return '<span class="badge badge-success">In Stock</span>';
    }

    // Render product table
    function renderTable() {
      const tbody = document.getElementById('product-tbody');
      const start = (currentPage - 1) * ROWS_PER_PAGE;
      const pageItems = filteredProducts.slice(start, start + ROWS_PER_PAGE);
      const total = filteredProducts.length;
      const totalPages = Math.ceil(total / ROWS_PER_PAGE) || 1;

      document.getElementById('pagination-info').textContent =
        \`Showing \${start + 1}–\${Math.min(start + ROWS_PER_PAGE, total)} of \${total} products\`;
      document.getElementById('page-indicator').textContent = \`Page \${currentPage} of \${totalPages}\`;
      document.getElementById('prev-btn').disabled = currentPage === 1;
      document.getElementById('next-btn').disabled = currentPage >= totalPages;

      if (pageItems.length === 0) {
        tbody.innerHTML = \`<tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--text-muted);">No products found.</td></tr>\`;
        return;
      }

      tbody.innerHTML = pageItems.map(p => \`
        <tr class="table-row-clickable" onclick="window.location='/pages/inventory/add-product.html?id=\${p.id}'">
          <td><code style="font-size:0.8rem;background:var(--bg-subtle,#f5f5f5);padding:2px 6px;border-radius:4px;">\${p.sku}</code></td>
          <td style="font-weight:500;">\${p.name}</td>
          <td>\${p.category}</td>
          <td>\${p.unit}</td>
          <td style="font-weight:600;">\${p.stock}</td>
          <td style="color:var(--text-muted);">\${p.reorderLevel}</td>
          <td>\${formatCurrency(p.price)}</td>
          <td>\${getStockBadge(p)}</td>
          <td id="actions-col-\${p.id}" \${user.role === 'staff' ? 'style="display:none;"' : ''}>
            <div style="display:flex;gap:0.5rem;" onclick="event.stopPropagation()">
              <a href="/pages/inventory/add-product.html?id=\${p.id}" class="btn btn-ghost btn-sm">✏️ Edit</a>
              <button class="btn btn-danger btn-sm" onclick="deleteProduct(\${p.id}, '\${p.name}')">🗑️</button>
            </div>
          </td>
        </tr>
      \`).join('');
    }

    // Filter logic
    function applyFilters() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const catFilter = document.getElementById('filter-category').value;
      const statusFilter = document.getElementById('filter-status').value;

      filteredProducts = MockData.products.filter(p => {
        const matchSearch = !query || p.name.toLowerCase().includes(query) || p.sku.toLowerCase().includes(query);
        const matchCat = !catFilter || p.category === catFilter;
        let matchStatus = true;
        if (statusFilter === 'in') matchStatus = p.stock > p.reorderLevel;
        else if (statusFilter === 'low') matchStatus = p.stock > 0 && p.stock <= p.reorderLevel;
        else if (statusFilter === 'out') matchStatus = p.stock === 0;
        return matchSearch && matchCat && matchStatus;
      });

      currentPage = 1;
      renderKPIs(filteredProducts);
      renderTable();
    }

    // Pagination
    function changePage(dir) {
      const totalPages = Math.ceil(filteredProducts.length / ROWS_PER_PAGE) || 1;
      currentPage = Math.max(1, Math.min(currentPage + dir, totalPages));
      renderTable();
    }

    // Delete product
    function deleteProduct(id, name) {
      openModal('Delete Product', \`
        <p>Are you sure you want to delete <strong>\${name}</strong>?</p>
        <p style="color:var(--text-muted);font-size:0.875rem;">This action cannot be undone. (Data resets on refresh anyway.)</p>
        <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
          <button class="btn btn-danger" onclick="confirmDelete(\${id})">Yes, Delete</button>
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      \`);
    }

    function confirmDelete(id) {
      const idx = MockData.products.findIndex(p => p.id === id);
      if (idx !== -1) MockData.products.splice(idx, 1);
      closeModal();
      showToast('Product deleted successfully', 'success');
      applyFilters();
    }

    // Debounced search
    const debouncedSearch = debounce(applyFilters, 300);
    document.getElementById('search-input').addEventListener('input', debouncedSearch);
    document.getElementById('filter-category').addEventListener('change', applyFilters);
    document.getElementById('filter-status').addEventListener('change', applyFilters);
    document.getElementById('clear-filters-btn').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-category').value = '';
      document.getElementById('filter-status').value = '';
      applyFilters();
    });

    // Init
    populateCategoryFilter();
    applyFilters();
  </script>
</body>
</html>
