<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase — Factory ERP</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    .tab-bar { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:1.25rem; }
    .tab-btn { padding:0.625rem 1.25rem; border:none; background:none; cursor:pointer; font-weight:500; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-2px; transition:color 0.15s; }
    .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="topbar-container"></div>
    <main class="page-content">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <div>
          <h1 class="page-title">🛒 Purchase</h1>
          <p style="color:var(--text-muted);margin-top:0.25rem;">Manage suppliers and purchase orders</p>
        </div>
        <div id="action-btns" style="display:flex;gap:0.75rem;">
          <a href="/pages/purchase/add-supplier.html" class="btn btn-primary" id="add-supplier-btn">+ Add Supplier</a>
          <button class="btn btn-ghost" onclick="openNewPOModal()" id="new-po-btn" style="display:none;">+ New PO</button>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('suppliers', this)">🏭 Suppliers</button>
        <button class="tab-btn" onclick="switchTab('pos', this)">📄 Purchase Orders</button>
      </div>

      <!-- Suppliers Tab -->
      <div class="tab-content active" id="tab-suppliers">
        <div class="card">
          <div class="card-body" style="padding:0;">
            <table class="table-base" style="width:100%;">
              <thead>
                <tr>
                  <th>Supplier Name</th>
                  <th>Contact Person</th>
                  <th>Phone</th>
                  <th>Categories</th>
                  <th>Total Orders</th>
                  <th>Last Order</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="suppliers-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Purchase Orders Tab -->
      <div class="tab-content" id="tab-pos">
        <div class="card" style="margin-bottom:1rem;">
          <div class="card-body" style="display:flex;gap:1rem;flex-wrap:wrap;">
            <select class="form-select" id="po-status-filter" onchange="renderPOs()" style="min-width:160px;">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="ordered">Ordered</option>
              <option value="received">Received</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="card">
          <div class="card-body" style="padding:0;">
            <table class="table-base" style="width:100%;">
              <thead>
                <tr>
                  <th>PO Number</th>
                  <th>Supplier</th>
                  <th>Items</th>
                  <th>Total Value</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="po-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script src="/assets/js/mockdata.js"></script>
  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/router.js"></script>
  <script>
    checkAuth();

    const PO_BADGES = {
      pending:   '<span class="badge badge-warning">Pending</span>',
      ordered:   '<span class="badge badge-info">Ordered</span>',
      received:  '<span class="badge badge-success">Received</span>',
      cancelled: '<span class="badge badge-danger">Cancelled</span>',
    };

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(\`tab-\${tabName}\`).classList.add('active');
      btn.classList.add('active');

      document.getElementById('add-supplier-btn').style.display = tabName === 'suppliers' ? '' : 'none';
      document.getElementById('new-po-btn').style.display = tabName === 'pos' ? '' : 'none';
    }

    function renderSuppliers() {
      const tbody = document.getElementById('suppliers-tbody');
      const suppliers = MockData.suppliers || [];

      if (suppliers.length === 0) {
        tbody.innerHTML = \`<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted);">No suppliers yet.</td></tr>\`;
        return;
      }

      tbody.innerHTML = suppliers.map(s => {
        const poCount = (MockData.purchaseOrders || []).filter(po => po.supplierId === s.id).length;
        const lastPO = (MockData.purchaseOrders || [])
          .filter(po => po.supplierId === s.id)
          .sort((a, b) => new Date(b.date) - new Date(a.date))[0];

        return \`
          <tr>
            <td style="font-weight:600;">\${s.name}</td>
            <td>\${s.contactPerson || '—'}</td>
            <td>\${s.phone || '—'}</td>
            <td style="max-width:180px;">
              \${(s.categories || []).map(c => \`<span class="badge badge-info" style="margin:1px;">\${c}</span>\`).join('')}
            </td>
            <td>\${poCount}</td>
            <td>\${lastPO ? formatDate(lastPO.date) : '—'}</td>
            <td>
              <div style="display:flex;gap:0.5rem;">
                <a href="/pages/purchase/add-supplier.html?id=\${s.id}" class="btn btn-ghost btn-sm">✏️ Edit</a>
                <button class="btn btn-danger btn-sm" onclick="deleteSupplier(\${s.id}, '\${s.name}')">🗑️</button>
              </div>
            </td>
          </tr>\`;
      }).join('');
    }

    function renderPOs() {
      const statusFilter = document.getElementById('po-status-filter').value;
      const pos = (MockData.purchaseOrders || []).filter(po =>
        !statusFilter || po.status === statusFilter
      );
      const tbody = document.getElementById('po-tbody');

      if (pos.length === 0) {
        tbody.innerHTML = \`<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted);">No purchase orders found.</td></tr>\`;
        return;
      }

      tbody.innerHTML = pos.map(po => {
        const supplier = (MockData.suppliers || []).find(s => s.id === po.supplierId);
        const itemCount = (po.items || []).length;
        const total = (po.items || []).reduce((sum, item) => sum + (item.qty * item.unitPrice || 0), 0);

        return \`
          <tr class="table-row-clickable" onclick="viewPO(\${po.id})">
            <td><strong>\${po.poNumber}</strong></td>
            <td>\${supplier ? supplier.name : 'Unknown'}</td>
            <td>\${itemCount} item\${itemCount !== 1 ? 's' : ''}</td>
            <td>\${formatCurrency(po.totalValue || total)}</td>
            <td>\${PO_BADGES[po.status] || po.status}</td>
            <td>\${formatDate(po.date)}</td>
            <td onclick="event.stopPropagation()">
              <button class="btn btn-ghost btn-sm" onclick="viewPO(\${po.id})">👁️ View</button>
            </td>
          </tr>\`;
      }).join('');
    }

    function viewPO(id) {
      const po = (MockData.purchaseOrders || []).find(p => p.id === id);
      if (!po) return;
      const supplier = (MockData.suppliers || []).find(s => s.id === po.supplierId);
      const items = po.items || [];

      openModal(\`PO Details — \${po.poNumber}\`, \`
        <div style="display:flex;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
          <div><span style="color:var(--text-muted);font-size:0.8rem;">Supplier</span><br><strong>\${supplier ? supplier.name : 'N/A'}</strong></div>
          <div><span style="color:var(--text-muted);font-size:0.8rem;">Date</span><br><strong>\${formatDate(po.date)}</strong></div>
          <div><span style="color:var(--text-muted);font-size:0.8rem;">Status</span><br>\${PO_BADGES[po.status] || po.status}</div>
        </div>
        <table class="table-base" style="width:100%;">
          <thead><tr><th>Item</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
          <tbody>
            \${items.length > 0
              ? items.map(item => \`
                <tr>
                  <td>\${item.name}</td>
                  <td>\${item.qty} \${item.unit || ''}</td>
                  <td>\${formatCurrency(item.unitPrice)}</td>
                  <td>\${formatCurrency(item.qty * item.unitPrice)}</td>
                </tr>\`).join('')
              : \`<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">No items</td></tr>\`
            }
          </tbody>
        </table>
        <div style="text-align:right;margin-top:0.75rem;font-size:1.1rem;font-weight:700;">
          Total: \${formatCurrency(po.totalValue || items.reduce((s, i) => s + i.qty * i.unitPrice, 0))}
        </div>
        <div style="margin-top:1rem;display:flex;gap:0.75rem;">
          <a href="/pages/purchase/grn.html" class="btn btn-primary btn-sm">📥 Create GRN</a>
          <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        </div>
      \`);
    }

    function deleteSupplier(id, name) {
      openModal('Delete Supplier', \`
        <p>Delete supplier <strong>\${name}</strong>?</p>
        <div style="display:flex;gap:0.75rem;margin-top:1.25rem;">
          <button class="btn btn-danger" onclick="confirmDeleteSupplier(\${id})">Delete</button>
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      \`);
    }

    function confirmDeleteSupplier(id) {
      const idx = (MockData.suppliers || []).findIndex(s => s.id === id);
      if (idx !== -1) MockData.suppliers.splice(idx, 1);
      closeModal();
      showToast('Supplier deleted', 'success');
      renderSuppliers();
    }

    function openNewPOModal() {
      const supplierOptions = (MockData.suppliers || []).map(s =>
        \`<option value="\${s.id}">\${s.name}</option>\`).join('');

      openModal('New Purchase Order', \`
        <div class="form-group">
          <label class="form-label">Supplier *</label>
          <select class="form-select" id="new-po-supplier">\${supplierOptions}</select>
        </div>
        <div class="form-group">
          <label class="form-label">Item Name *</label>
          <input type="text" class="form-input" id="new-po-item" placeholder="e.g. Plywood Sheet">
        </div>
        <div class="form-group">
          <label class="form-label">Quantity *</label>
          <input type="number" class="form-input" id="new-po-qty" min="1" placeholder="50">
        </div>
        <div class="form-group">
          <label class="form-label">Unit Price (₹) *</label>
          <input type="number" class="form-input" id="new-po-price" min="0" placeholder="200">
        </div>
        <div style="display:flex;gap:0.75rem;margin-top:1rem;">
          <button class="btn btn-primary" onclick="createPO()">Create PO</button>
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      \`);
    }

    function createPO() {
      const supplierId = parseInt(document.getElementById('new-po-supplier').value);
      const itemName = document.getElementById('new-po-item').value.trim();
      const qty = parseInt(document.getElementById('new-po-qty').value);
      const price = parseFloat(document.getElementById('new-po-price').value);

      if (!itemName || !qty || !price) { showToast('Fill all required fields', 'warning'); return; }

      if (!MockData.purchaseOrders) MockData.purchaseOrders = [];
      const newId = Math.max(...MockData.purchaseOrders.map(p => p.id), 0) + 1;
      MockData.purchaseOrders.push({
        id: newId,
        poNumber: \`PO-\${String(newId).padStart(4, '0')}\`,
        supplierId,
        date: new Date().toISOString().split('T')[0],
        status: 'pending',
        items: [{ name: itemName, qty, unitPrice: price, unit: 'pcs' }],
        totalValue: qty * price,
      });

      closeModal();
      showToast('Purchase order created!', 'success');
      renderPOs();
    }

    // Init
    renderSuppliers();
    renderPOs();
  </script>
</body>
</html>
