<!--
  components/modal.html — Reusable Modal Shell
  Factory ERP Prototype | Claude A — Foundation Layer

  Injected into every page. Controlled via utils.js → openModal() / closeModal().
  ESC key and overlay click handled in utils.js.
-->
<div class="modal-overlay" id="modal-overlay" style="display:none;">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <!-- Header -->
    <div class="modal-header">
      <h3 id="modal-title">Modal Title</h3>
      <button class="btn-close" id="modal-close" onclick="closeModal()" aria-label="Close modal">×</button>
    </div>

    <!-- Body — content injected by openModal() -->
    <div class="modal-body" id="modal-body">
      <!-- Dynamic content here -->
    </div>

    <!-- Footer — buttons injected by caller (optional) -->
    <div class="modal-footer" id="modal-footer">
      <!-- Dynamic footer buttons here -->
    </div>

  </div>
</div>
